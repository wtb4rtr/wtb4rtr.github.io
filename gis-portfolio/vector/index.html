<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vector Analyses – William’s GIS Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/assets/css/style.css">

  <!-- Page-specific styles -->
  <style>
    body.vector-page .hero {
      background: url("/assets/images/gis-portfolio/vector/topo.jpg") no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    body.vector-page .hero-content {
      text-align: center;
      z-index: 2;
    }

    body.vector-page .hero-title-box {
      background: rgba(255, 255, 255, 0.95); /* less transparent */
      padding: 2rem 4rem;
      border-radius: 12px;
      display: inline-block;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.25);
      margin-bottom: 2rem;
    }

    body.vector-page .hero-title-box h1 {
      margin: 0;
      font-size: 4rem;
      color: #111;
      letter-spacing: 1px;
    }

    body.vector-page .hero-nav-container {
      position: absolute;
      bottom: 8rem; /* raised much higher */
      width: 100%;
      text-align: center;
      z-index: 2;
    }

    body.vector-page .hero-nav {
      background-color: black;
      display: inline-block;
      padding: 1rem 2rem;
      border-radius: 6px;
    }

    body.vector-page .hero-nav a {
      display: inline-block;
      margin: 0 0.75rem;
      padding: 0.75rem 1.25rem;
      background: white;
      text-decoration: none;
      color: black;
      font-weight: bold;
      border-radius: 4px;
      transition: background 0.2s;
    }

    body.vector-page .hero-nav a:hover {
      background: #eee;
    }
  </style>
</head>
<body class="vector-page">

  <!-- Global Navigation Bar -->
  <nav>
    <img src="/assets/images/common/surveyor.gif" alt="Surveyor Logo">
    <div class="site-title">Virtual Bill Brown</div>
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/gis-portfolio/">GIS Portfolio</a></li>
      <li><a href="/survey-mapping/">Survey/Mapping</a></li>
      <li><a href="/excavation-of/">Excavation Of…</a></li>
      <li><a href="/bioarchaeology/">Bioarchaeology</a></li>
      <li><a href="/education/">Education</a></li>
      <li><a href="/artifact-photography/">Artifact Photography</a></li>
    </ul>
  </nav>

  <!-- Hero Section with Boxed Title -->
  <section class="hero">
    <div class="hero-content">
      <div class="hero-title-box">
        <h1>VECTOR ANALYSES</h1>
      </div>
    </div>

    <!-- Updated Lower Nav -->
    <div class="hero-nav-container">
      <nav class="hero-nav">
        <a href="vector/">MAYA SETTLEMENT PATTERNS</a>
        <a href="raster/">SHARED CHURCHES PROJECT</a>
      </nav>
    </div>

  <!-- Main content area -->
  <main>
    <!-- Page-specific content goes here -->
  </main>
