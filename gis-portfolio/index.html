<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GIS Portfolio – William’s GIS Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/assets/css/style.css"> <!-- Global stylesheet -->

  <!-- Inline CSS to customize hero section and buttons -->
  <style>
    /* Full-screen hero section with globe background */
    .hero {
      background-image: url("/assets/images/gis-portfolio/globe.png"); /* Globe background image */
      background-size: cover;             /* Scale image to cover the hero */
      background-repeat: no-repeat;       /* Prevent repeat */
      background-position: center center; /* Center horizontally and vertically */
      background-attachment: fixed;       /* Fixed during scroll */
      height: 100vh;                      /* Full viewport height */
      display: flex;                      /* Use flexbox */
      flex-direction: column;            /* Stack vertically */
      justify-content: center;           /* Center vertically */
      align-items: center;               /* Center horizontally */
      position: relative;                /* Needed for positioning inner elements */
      text-align: center;                /* Center text inside */
    }

    /* Title box styling */
    .hero-title-box {
      background: rgba(0, 0, 0, 0.88);    /* Deep black with slight transparency */
      padding: 2rem 3rem;                /* Padding around title text */
      border-radius: 12px;               /* Rounded corners */
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.4); /* Strong shadow for lift */
    }

    /* Section title: GIS PORTFOLIO */
    .hero-title-box h2 {
      margin: 0;                         /* Remove margin */
      font-size: 4.2rem;                 /* Slightly larger font */
      color: #fff;                       /* Bright white text */
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.4); /* Shadow improves legibility */
    }

    /* Subtitle: name */
    .hero-title-box h1 {
      margin: 0.75rem 0 0 0;             /* Space above */
      font-size: 1.4rem;                 /* Slightly larger name */
      color: #ccc;                       /* Light gray name text */
      letter-spacing: 1px;               /* Spread letters */
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.4); /* Shadow for contrast */
    }

    /* Lower nav container */
    .hero-nav-container {
      margin-top: 2rem;                  /* Space above buttons */
    }

    /* Nav button row styling */
    .hero-nav {
      display: flex;                     /* Horizontal layout */
      gap: 1rem;                         /* Space between buttons */
      flex-wrap: wrap;                   /* Wrap on smaller screens */
      justify-content: center;          /* Center nav */
    }

    /* Individual nav button styling */
    .hero-nav a {
      margin: 0;                                   /* Remove default margins */
      padding: 0.75rem 1.5rem;                     /* Inner spacing */
      background-color: #ffffff;                   /* Bright white background */
      color: #2c2c2c;                              /* Dark gray text */
      text-decoration: none;                       /* No underline */
      font-weight: bold;                           /* Bold font */
      border-radius: 6px;                          /* Rounded corners */
      transition: background 0.3s ease, transform 0.2s; /* Hover effect */
    }

    /* Hover effect for nav buttons */
    .hero-nav a:hover {
      background-color: #f2f2f2;                   /* Slightly dimmer white */
      transform: scale(1.05);                      /* Slight zoom */
    }
  </style>
</head>

<body>

  <section class="hero">

    <div class="hero-content">
      <div class="hero-title-box">
        <h2>GIS PORTFOLIO</h2>
        <h1>WILLIAM T. BROWN</h1>
      </div>
    </div>

    <!-- Section Navigation -->
    <div class="hero-nav-container">
      <nav class="hero-nav">
        <a href="/gis-portfolio/vector/">VECTOR ANALYSES</a>
        <a href="/gis-portfolio/raster/">RASTER ANALYSES</a>

		<a href="/gis-portfolio/r-python/">R AND PYTHON</a>
        <a href="/gis-portfolio/archmaps/">ARCHAEOLOGICAL MAPS</a>
      </nav>

  </section>

  <!-- Main content -->
  <main>
    <!-- Reserved for future portfolio content -->

</body>
</html>
