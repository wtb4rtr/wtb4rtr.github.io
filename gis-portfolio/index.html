<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GIS Portfolio – William’s GIS Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/assets/css/style.css"> <!-- Link to your global stylesheet -->

  <!-- Inline CSS to expand background image to full screen -->
  <style>
    /* Style the hero section to display a full-screen background image */
    .hero {
      background-image: url("/assets/images/gis-portfolio/globe.png"); /* Your background image: globe.png */
      background-size: cover;             /* Ensures the image stretches to cover the entire hero section */
      background-repeat: no-repeat;       /* Prevents the image from tiling */
      background-position: center center; /* Centers the image horizontally and vertically */
      background-attachment: fixed;       /* Keeps the background fixed during scroll (parallax effect) */
      height: 100vh;                      /* Makes the hero section fill 100% of the viewport height */
      display: flex;                      /* Use flexbox for layout */
      flex-direction: column;            /* Stack children vertically */
      justify-content: center;           /* Vertically center the content */
      align-items: center;               /* Horizontally center the content */
      position: relative;                /* Enables absolute positioning of nested elements if needed */
      text-align: center;                /* Centers text inside */
    }

    /* Style the title box inside the hero section */
    .hero-title-box {
      background: rgba(255, 255, 255, 0.85); /* Semi-transparent white background */
      padding: 2rem 3rem;                   /* Space inside the box */
      border-radius: 12px;                  /* Rounded corners */
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.3); /* Subtle shadow for depth */
    }

    /* Style the lower navigation container */
    .hero-nav-container {
      margin-top: 2rem;       /* Space above the nav links */
    }

    /* Style the navigation links in the lower nav */
    .hero-nav a {
      margin: 0 1rem;                         /* Space between buttons */
      padding: 0.75rem 1.5rem;                /* Padding inside buttons */
      background-color: rgba(255, 255, 255, 0.8); /* Button background */
      color: #2c2c2c;                         /* Text color */
      text-decoration: none;                  /* Remove underline */
      font-weight: bold;                      /* Bold text */
      border-radius: 6px;                     /* Rounded corners */
      transition: background 0.3s ease;       /* Smooth hover effect */
    }

    /* Button hover effect */
    .hero-nav a:hover {
      background-color: rgba(255, 255, 255, 1); /* Full opacity on hover */
    }
  </style>
</head>

<body>
  <!-- Global Navigation Bar -->
  <nav>
    <img src="/assets/images/common/surveyor.gif" alt="Surveyor Logo">
    <div class="site-title">Virtual Bill Brown</div>
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/gis-portfolio/">GIS Portfolio</a></li>
      <li><a href="/survey-mapping/">Survey/Mapping</a></li>

      <li><a href="/education/">Education</a></li>
      <li><a href="/artifact-photography/">Artifact Photography</a></li>
    </ul>
  </nav>

  <!-- Hero Section with Full-Page Background Image -->
  <section class="hero">
    <div class="hero-content">
      <div class="hero-title-box">
        <h2>GIS PORTFOLIO</h2>
        <h1>WILLIAM T. BROWN</h1>
      </div>
    </div>

    <!-- Lower nav linking to each portfolio section -->
    <div class="hero-nav-container">
      <nav class="hero-nav">
        <a href="/gis-portfolio/vector/">VECTOR ANALYSES</a>
        <a href="/gis-portfolio/raster/">RASTER ANALYSES</a>
        <a href="/gis-portfolio/remote-sensing/">REMOTE SENSING</a>
        <a href="/gis-portfolio/regression/">REGRESSION ANALYSES</a>
        <a href="/gis-portfolio/archaeological-maps/">ARCHAEOLOGICAL MAPS</a>
      </nav>
    </div>
  </section>

  <!-- Main content -->
  <main>
    <!-- Add any section-specific content here -->
  </main>
</body>
</html>
