<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Regression Analyses – William’s GIS Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/assets/css/style.css">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <!-- Page-specific styles -->
  <style>
    body.regression-page h1 {
      font-family: 'Playfair Display', serif;
    }

    body.regression-page .hero {
      background-image: url("/assets/images/gis-portfolio/regression/regress.jpg");
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center top;
      background-attachment: scroll;
      height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding-top: 3rem; /* Raised title slightly */
    }

    body.regression-page .hero-content {
      text-align: center;
      z-index: 2;
      margin-bottom: 1rem;
    }

    body.regression-page .hero-title-box {
      background: #fdf6e3;
      padding: 1rem 2rem;
      border-radius: 12px;
      display: inline-block;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.25);
      border: 2px solid #c44500;
    }

    body.regression-page .hero-title-box h1 {
      margin: 0;
      font-size: 3.3rem;
      color: #2c2c2c;
      letter-spacing: 1px;
      text-transform: uppercase;
      position: relative;
    }

    body.regression-page .hero-title-box h1::after {
      content: "";
      display: block;
      margin: 1rem auto 0 auto;
      width: 80px;
      height: 4px;
      background: #c44500;
      border-radius: 2px;
    }

    body.regression-page .hero-nav-container {
      position: absolute;
      top: 10rem;
      left: 2rem;
      z-index: 2;
    }

    body.regression-page .hero-nav {
      background-color: #a32638;
      padding: 1rem;
      border-radius: 6px;
      border: 2px solid #a32638;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    body.regression-page .hero-nav a {
      display: block;
      background: #aa2e45;
      color: #aa2e45;
      font-weight: bold;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border-radius: 4px;
      position: relative;
      z-index: 1;
      transition: background 0.2s, transform 0.2s;
    }

    body.regression-page .hero-nav a::before {
      content: '';
      position: absolute;
      top: 4px;
      left: 4px;
      right: 4px;
      bottom: 4px;
      background: #fffaf5;
      border: 2px solid #aa2e45;
      z-index: -1;
      border-radius: 2px;
    }

    body.regression-page .hero-nav a:hover {
      background: #e0d3ba;
      border: 1px solid #8b0000;
      color: #8b0000;
    }
  </style>
</head>

<body class="regression-page">
  <!-- Global Navigation Bar -->
  <nav>
    <img src="/assets/images/common/surveyor.gif" alt="Surveyor Logo">
    <div class="site-title">Virtual Bill Brown</div>
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/gis-portfolio/">GIS Portfolio</a></li>
      <li><a href="/survey-mapping/">Survey/Mapping</a></li>
      <li><a href="/excavation-of/">Excavation Of…</a></li>
      <li><a href="/bioarchaeology/">Bioarchaeology</a></li>
      <li><a href="/education/">Education</a></li>
      <li><a href="/artifact-photography/">Artifact Photography</a></li>
    </ul>
  </nav>

  <!-- Hero Section with Boxed Title -->
  <section class="hero">
    <div class="hero-content">
      <div class="hero-title-box">
        <h1>REGRESSION ANALYSES</h1>
      </div>
    </div>

    <!-- Vertical Left Nav -->
    <div class="hero-nav-container">
      <nav class="hero-nav">
        <a href="mayaisotopes/">MAYA ISOTOPES</a>
        <a href="berncoairpol/">BERNCO AIR POLLUTION</a>
      </nav>
    </div>
  </section>

  <!-- Main content area -->
  <main>
    <!-- Page-specific content goes here -->
  </main>
</body>
</html>
