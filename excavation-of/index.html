<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <title>Excavation – William’s GIS Portfolio</title>

  <!-- Google Fonts -->
 <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">


  <!-- Page-specific styles -->
<style>
body.excavation-page h1 {
  font-family: 'Oswald', sans-serif;
  font-weight: 700; /* Ensures bold styling */
}


    /* Main hero section with background image */
    body.excavation-page .hero {
      background-image: url("/assets/images/excavation-of/nn2.JPG"); 
      background-size: cover;           /* Stretch to cover full section */
      background-repeat: no-repeat;     /* Do not repeat image */
      background-position: center top;  /* Align center horizontally, top vertically */
      background-attachment: scroll;    /* Allow scrolling with page */
      height: 100vh;                    /* Full viewport height */
      position: relative;               /* Establish positioning context */
      display: flex;                    /* Use flexbox layout */
      flex-direction: column;           /* Stack children vertically */
      justify-content: flex-start;      /* Align content at the top */
      align-items: center;              /* Center items horizontally */
      padding-top: 3rem;                /* Top padding under nav */
    }

    /* Container for centered title */
    body.excavation-page .hero-content {
      text-align: center;              /* Center text */
      z-index: 2;                      /* Layer above background */
      margin-bottom: 1rem;             /* Space below title */
    }

    /* Style for the title background box */
    body.excavation-page .hero-title-box {
      background: #a32638;             /* Crimson Tide background (Alabama Crimson) */
      padding: 1rem 2rem;              /* Internal spacing */
      border-radius: 12px;             /* Rounded corners */
      display: inline-block;           /* Fit tightly to content */
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.25); /* Drop shadow for depth */
      border: 4px solid #fffff0;       /* Border to match background */
    }

    /* Main title styling */
    body.excavation-page .hero-title-box h1 {
      margin: 0;                       /* Remove default spacing */
      font-size: 3.5rem;               /* Set large title size */
      color: #fffff0;                  /* Ivory text */
      letter-spacing: 1px;             /* Slight spacing between letters */
      text-transform: uppercase;       /* Capital letters */
      position: relative;              /* Anchor underline below */
    }

    /* Decorative underline below title */
    body.excavation-page .hero-title-box h1::after {
      content: "";                     /* Generate line */
      display: block;                  /* Block-level element */
      margin: 1rem auto 0 auto;        /* Space above, centered */
      width: 100px;                    /* Width of line */
      height: 4px;                     /* Thickness of line */
      background: #fffff0;             /* Ivory color */
      border-radius: 2px;              /* Rounded ends */
    }

    /* Container for vertical nav list */
    body.excavation-page .hero-nav-container {
      position: absolute;              /* Manual placement */
      top: 4rem;                       /* Distance from top of hero */
      right: 2rem;                     /* Align to right margin */
      z-index: 2;                      /* Layer above background */
      display: flex;                   /* Stack label + nav */
      flex-direction: column;          /* Vertical alignment */
      align-items: center;             /* Keep nav links centered */
    }

    

    /* Container box for nav links */
    body.excavation-page .hero-nav {
      background-color: #2f4f4f;       /* Slate gray box */
      padding: 1rem;                   /* Internal spacing */
      border-radius: 6px;              /* Rounded corners */
      border: 2px solid #2f4f4f;       /* Border same as background */
      display: flex;                   /* Flex layout */
      flex-direction: column;          /* Stack items vertically */
      gap: 1rem;                       /* Space between buttons */
    }

    /* Style for each nav link button */
    body.excavation-page .hero-nav a {
      display: block;                  /* Full-width block button */
      background: #dcdcdc;             /* Same as title box */
      color: #2f4f4f;                  /* Text color: dark slate */
      font-weight: bold;               /* Bold text */
      text-decoration: none;           /* Remove underline */
      padding: 0.75rem 1.5rem;         /* Padding inside button */
      border-radius: 4px;              /* Rounded corners */
      position: relative;              /* For pseudo-elements */
      z-index: 1;                      /* Above inner box */
      transition: background 0.2s, transform 0.2s; /* Hover animation */
      border: none;                    /* Remove border */
      outline: none;                   /* Remove focus outline */
      box-shadow: none;                /* No shadows */
    }

    /* Hover effect for buttons */
    body.excavation-page .hero-nav a:hover {
      background: #f5f5f5;             /* Lighter gray on hover */
      color: #000;                     /* Black text on hover */
      transform: translateX(2px);      /* Subtle shift right */
    }
  </style>
</head>
