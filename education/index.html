<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Education – William’s GIS Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ========================
       Page-Specific Styles
  ========================= -->
  <style>

    /* ===== Navigation Bar Styles ===== */
    nav {
      display: flex;
      align-items: center;
      background-color: #000;
      padding: 0.5rem 2rem;
    }

    nav img {
      height: 40px;
      margin-right: 1rem;
    }

    nav .site-title {
      font-size: 1.5rem;
      font-weight: bold;
      letter-spacing: 1px;
      color: white;
      margin-right: auto;
    }

    nav ul {
      display: flex;
      list-style: none;
      margin-left: auto;
    }

    nav li + li {
      margin-left: 1rem;
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 0.5rem 1rem;
      text-transform: uppercase;
      font-weight: bold;
    }

    nav a:hover {
      background-color: #1a1a1a;
      border-radius: 4px;
    }

    /* ===== Page Defaults ===== */
    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    body.education-page {
      background-image: none !important;  /* Kill any background from global styles */
      background-color: #000;             /* Set full page background to black */
    }

    /* ===== Hero Section Layout ===== */
    body.education-page .hero {
      display: flex;                  /* Lay out center + side columns */
      justify-content: center;       /* Center entire content horizontally */
      align-items: center;           /* Center content vertically */
      background-color: #000;        /* Black background for this section */
      padding: 2rem;
      height: 100vh;                 /* Full viewport height */
      gap: 2rem;                     /* Space between columns */
    }

    /* ===== Left and Right Image Columns ===== */
    .side-column {
      display: flex;
      flex-direction: column;        /* Stack three images vertically */
      gap: 1rem;                     /* Vertical space between images */
      max-height: 90vh;
    }

    /* ===== All Images (side + center) ===== */
    .side-column img,
    .hero-image {
      max-width: 150px;
      height: auto;
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

  </style>
</head>

<body class="education-page">
  <!-- ========================
       Global Navigation Bar
  ========================= -->
  <nav>
    <img src="/assets/images/common/surveyor.gif" alt="Surveyor Logo">
    <div class="site-title">Virtual Bill Brown</div>
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/gis-portfolio/">GIS Portfolio</a></li>
      <li><a href="/survey-mapping/">Survey/Mapping</a></li>
      <li><a href="/excavation-of/">Excavation Of…</a></li>
      <li><a href="/bioarchaeology/">Bioarchaeology</a></li>
      <li><a href="/education/">Education</a></li>
      <li><a href="/artifact-photography/">Artifact Photography</a></li>
    </ul>
  </nav>

  <!-- ========================
       Hero Section with Images
  ========================= -->
  <section class="hero">
    <!-- Left Column: 3 stacked logos -->
    <div class="side-column">
      <img src="/assets/images/education/rtr.jpg" alt="RTR Logo">
      <img src="/assets/images/education/unmlogo.jpg" alt="UNM Logo">
      <img src="/assets/images/education/arizlogo.jpg" alt="University of Arizona Logo">
    </div>

    <!-- Center Column: Belushi image -->
    <div class="center-column">
      <img src="/assets/images/education/col1.jpg" alt="Belushi" class="hero-image">
    </div>

    <!-- Right Column: 3 stacked transcript images -->
    <div class="side-column">
      <img src="/assets/images/education/alatrans.png" alt="Alabama Transparent Logo">
      <img src="/assets/images/education/unmtrans.png" alt="UNM Transparent Logo">
      <img src="/assets/images/education/ariztrans.png" alt="Arizona Transparent Logo">
    </div>
  </section>

  <!-- ========================
       Optional Divider Section
  ========================= -->
  <div class="divider">
    <!-- Empty divider: can be used later for transitions -->
  </div>

</body>
</html>
