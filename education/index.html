<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Education – William’s GIS Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ========================
       Page-Specific Styles
  ========================= -->
  <style>
    /* ===== Global Reset ===== */
    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    body.education-page {
      background-color: #000;  /* Full black background */
      font-family: 'Segoe UI', sans-serif;
      color: #eee;
    }

    /* ===== Top Navigation Bar ===== */
    nav {
      display: flex;
      align-items: center;
      background-color: #000;
      padding: 0.5rem 2rem;
    }

    nav img {
      height: 40px;
      margin-right: 1rem;
    }

    nav .site-title {
      font-size: 1.5rem;
      font-weight: bold;
      letter-spacing: 1px;
      color: white;
      margin-right: auto;
    }

    nav ul {
      display: flex;
      list-style: none;
      margin-left: auto;
    }

    nav li + li {
      margin-left: 1rem;
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 0.5rem 1rem;
      text-transform: uppercase;
      font-weight: bold;
    }

    nav a:hover {
      background-color: #1a1a1a;
      border-radius: 4px;
    }

    /* ===== Hero Section (Belushi image only) ===== */
    .hero {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      height: 100vh;
      background-color: #000;
      padding: 0;
    }

    .hero-image {
      height: 85vh;                      /* Dominant vertical scale */
      width: auto;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 0 25px rgba(0,0,0,0.7);
    }
  </style>
</head>

<body class="education-page">
  <!-- ========================
       Top Navigation Bar
  ========================= -->
  <nav>
    <img src="/assets/images/common/surveyor.gif" alt="Surveyor Logo">
    <div class="site-title">Virtual Bill Brown</div>
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/gis-portfolio/">GIS Portfolio</a></li>
      <li><a href="/survey-mapping/">Survey/Mapping</a></li>
      <li><a href="/excavation-of/">Excavation Of…</a></li>
      <li><a href="/bioarchaeology/">Bioarchaeology</a></li>
      <li><a href="/education/">Education</a></li>
      <li><a href="/artifact-photography/">Artifact Photography</a></li>
    </ul>
  </nav>

  <!-- ========================
       Hero Section (Belushi Only)
  ========================= -->
  <section class="hero">
    <img src="/assets/images/education/col1.jpg" alt="Belushi" class="hero-image">
  </section>
</body>
</html>
