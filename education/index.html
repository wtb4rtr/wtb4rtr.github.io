<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Education – William’s GIS Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    /* ========== GLOBAL RESET & BASE ========== */
    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background-color: #000;
      font-family: 'Segoe UI', sans-serif;
      color: #eee;
    }

    /* ========== NAVIGATION BAR ========== */
    nav {
      display: flex;
      align-items: center;
      background-color: #000;
      padding: 0.5rem 2rem;
    }

    nav img {
      height: 40px;
      margin-right: 1rem;
    }

    nav .site-title {
      font-size: 1.5rem;
      font-weight: bold;
      letter-spacing: 1px;
      color: white;
      margin-right: auto;
    }

    nav ul {
      display: flex;
      list-style: none;
      margin-left: auto;
    }

    nav li + li {
      margin-left: 1rem;
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 0.5rem 1rem;
      text-transform: uppercase;
      font-weight: bold;
    }

    nav a:hover {
      background-color: #1a1a1a;
      border-radius: 4px;
    }

    /* ========== HERO SECTION (BELUSHI IMAGE) ========== */
    .hero {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      height: 85vh;
      padding-top: 2rem;
    }

    .hero-image {
      height: 85vh;
      width: auto;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 0 25px rgba(0,0,0,0.7);
    }

    /* ========== LOGO SECTION ========== */
    .education-logos {
      display: flex;
      justify-content: center;
      gap: 3rem;
      padding-top: 2vh;
      padding-bottom: 2rem;
      background-color: #000;
    }

    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-container img {
      max-width: 260px;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 0 12px rgba(0,0,0,0.5);
    }

    .logo-caption {
      margin-top: 0.5rem;
      font-size: 1rem;
      color: #ccc;
      text-align: center;
      font-weight: 600;
    }

    /* ========== TRANSCRIPT SECTION ========== */
    .education-transcripts {
      display: flex;
      justify-content: center;
      gap: 3rem;
      padding: 3rem 2rem;
      background-color: #000;
    }

    .education-transcripts img {
      max-width: 320px;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 0 12px rgba(0,0,0,0.5);
    }
  </style>
</head>

<body class="education-page">
  <!-- ========== NAVIGATION BAR ========== -->
  <nav>
    <img src="/assets/images/common/surveyor.gif" alt="Surveyor Logo">
    <div class="site-title">Virtual Bill Brown</div>
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/gis-portfolio/">GIS Portfolio</a></li>
      <li><a href="/survey-mapping/">Survey/Mapping</a></li>
      <li><a href="/excavation-of/">Excavation Of…</a></li>
      <li><a href="/bioarchaeology/">Bioarchaeology</a></li>
      <li><a href="/education/">Education</a></li>
      <li><a href="/artifact-photography/">Artifact Photography</a></li>
    </ul>
  </nav>

  <!-- ========== HERO SECTION (Belushi Image) ========== -->
  <section class="hero">
    <img src="/assets/images/education/col1.jpg" alt="Belushi" class="hero-image">
  </section>

  <!-- ========== LOGO SECTION ========== -->
  <section class="education-logos">
    <div class="logo-container">
      <img src="/assets/images/education/arizlogo.jpg" alt="Arizona Logo">
      <div class="logo-caption">University of Arizona</div>
    </div>
    <div class="logo-container">
      <img src="/assets/images/education/unmlogo.jpg" alt="UNM Logo">
      <div class="logo-caption">University of New Mexico</div>
    </div>
    <div class="logo-container">
      <img src="/assets/images/education/rtr.jpg" alt="Alabama Logo">
      <div class="logo-caption">University of Alabama</div>
    </div>
  </section>

  <!-- ========== TRANSCRIPT SECTION ========== -->
  <section class="education-transcripts">
    <img src="/assets/images/education/ariztrans.png" alt="Arizona Transcript">
    <img src="/assets/images/education/unmtrans.png" alt="UNM Transcript">
    <img src="/assets/images/education/alatrans.png" alt="Alabama Transcript">
  </section>
</body>
</html>
