<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Artifact Photography – William’s GIS Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/assets/css/style.css"> <!-- Global stylesheet -->

  <!-- Page-specific styles -->
  <style>
    /* Ensure full-width layout without scroll bars */
    html, body {
      margin: 0;               /* Remove default margins */
      padding: 0;              /* Remove default padding */
      overflow-x: hidden;      /* Prevent horizontal scrolling */
    }

    /* Hero section with background image and top-aligned title */
    body.survey-page .hero {
      background-image: url("/assets/images/artifact-photography/presto.jpg"); /* Set background image */
      background-size: cover;          /* Ensure image covers entire section */
      background-repeat: no-repeat;    /* Do not repeat the image */
      background-position: center;     /* Center image in container */
      background-attachment: fixed;    /* Make image fixed during scroll */
      height: 100vh;                   /* Full viewport height */
      display: flex;                   /* Use flexbox layout */
      flex-direction: column;          /* Stack children vertically */
      justify-content: flex-start;     /* Align children to top */
      align-items: center;             /* Center horizontally */
      text-align: center;              /* Center text inside */
      padding-top: 2rem;               /* Space above content */
    }

    /* Title box styling */
    body.survey-page .hero-title-box {
      background: #738678;             /* Earthy background color (Xanadu) */
      padding: 0.75rem 1rem;           /* Inner spacing */
      border-radius: 12px;             /* Rounded corners */
    }

    /* Page title inside title box */
    body.survey-page .hero-title-box h1 {
      margin: 0;                       /* Remove default margin */
      font-size: 3.5rem;               /* Large font size */
      color: #ffffff;                  /* White text */
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6); /* Shadow for contrast */
    }

    /* Main content area for projects */
    body.survey-page main {
      padding: 4rem 2rem;              /* Top/bottom and side padding */
      max-width: 900px;                /* Limit width of content */
      margin: 0 auto;                  /* Center content horizontally */
    }

    /* Each individual project block */
    .project-section {
      margin-bottom: 4rem;             /* Space below each project */
      border-bottom: 1px solid #ccc;   /* Divider line */
      padding-bottom: 3rem;            /* Space under content */
    }

    /* Project title */
    .project-section h2 {
      font-size: 1.75rem;              /* Heading size */
      color: #a32638;                  /* Crimson accent */
      margin-bottom: 1rem;             /* Space below title */
    }

    /* Project map or image */
    .project-section img {
      width: 100%;                     /* Full width of container */
      max-width: 800px;                /* Limit to 800px max */
      height: auto;                    /* Maintain aspect ratio */
      border: 2px solid #ccc;          /* Gray border */
      border-radius: 8px;              /* Rounded corners */
      margin-bottom: 1rem;             /* Space below image */
    }

    /* Project description text */
    .project-section p {
      font-size: 1rem;                 /* Base font size */
      line-height: 1.6;                /* Comfortable line spacing */
      color: #333;                     /* Dark gray text */
    }
	
  </style>
</head>

<body class="survey-page">
  <!-- Global Navigation Bar -->
  <nav>
    <img src="/assets/images/common/surveyor.gif" alt="Surveyor Logo">
    <div class="site-title">Virtual Bill Brown</div>
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/gis-portfolio/">GIS Portfolio</a></li>
      <li><a href="/survey-mapping/">Survey/Mapping</a></li>
      <li><a href="/excavation-of/">Excavation Of…</a></li>
      <li><a href="/bioarchaeology/">Bioarchaeology</a></li>
      <li><a href="/education/">Education</a></li>
      <li><a href="/artifact-photography/">Artifact Photography</a></li>
    </ul>
  </nav>

  <!-- Hero Section with title -->
  <section class="hero">
    <div class="hero-content">
      <div class="hero-title-box">
        <h1>ARTIFACT PHOTOGRAPHY</h1>
      </div>
    </div>
  </section>

</body>
</html>
