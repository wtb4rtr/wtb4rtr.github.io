<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Artifact Photography – William’s GIS Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/assets/css/style.css"> <!-- Global stylesheet -->

  <!-- Page-specific styles -->
  <style>
    /* ==== Reset and base layout ==== */
    html, body {
      margin: 0;                /* Remove default margin around the page */
      padding: 0;               /* Remove default padding around the page */
      overflow-x: hidden;       /* Prevent horizontal scroll due to wide elements */
    }

    /* ==== Hero Section Styles ==== */
    body.survey-page .hero {
      background-image: url("/assets/images/artifact-photography/presto.jpg"); /* Hero background image */
      background-size: cover;               /* Stretch image to cover entire section */
      background-repeat: no-repeat;         /* Don't repeat the background */
      background-position: center;          /* Center image horizontally/vertically */
      background-attachment: fixed;         /* Keep background image fixed during scroll */
      height: 100vh;                        /* Hero takes full height of viewport */
      display: flex;                        /* Use Flexbox layout */
      flex-direction: column;              /* Stack children vertically */
      justify-content: flex-start;         /* Align content to top */
      align-items: center;                 /* Center content horizontally */
      text-align: center;                  /* Center text inside the section */
      padding-top: 2rem;                   /* Add space at top for visual breathing room */
    }

    /* ==== Hero Title Box ==== */
    body.survey-page .hero-title-box {
      background: #738678;                 /* Earthy green-gray tone */
      padding: 0.75rem 1rem;               /* Inner spacing: top/bottom + sides */
      border-radius: 12px;                 /* Rounded corners for the box */
    }

    /* ==== Hero Heading Text ==== */
    body.survey-page .hero-title-box h1 {
      margin: 0;                           /* Remove default h1 margin */
      font-size: 3.5rem;                   /* Large title size */
      color: #ffffff;                      /* White text color */
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6); /* Soft black shadow for contrast */
    }

    /* ==== Main Content Layout ==== */
    body.survey-page main {
      padding: 4rem 2rem;                  /* Space inside content block */
      max-width: 900px;                    /* Max readable width for large screens */
      margin: 0 auto;                      /* Center the main content */
    }

    /* ==== Project Sections ==== */
    .project-section {
      margin-bottom: 4rem;                 /* Space between each project section */
      border-bottom: 1px solid #ccc;       /* Horizontal line for visual separation */
      padding-bottom: 3rem;                /* Space below the content before next section */
    }

    /* ==== Project Section Headings ==== */
    .project-section h2 {
      font-size: 1.75rem;                  /* Heading size for project titles */
      color: #a32638;                      /* Crimson color for emphasis */
      margin-bottom: 1rem;                 /* Space below heading */
    }

    /* ==== Project Images ==== */
    .project-section img {
      width: 100%;                         /* Responsive image width */
      max-width: 800px;                    /* Prevent image from getting too large */
      height: auto;                        /* Maintain aspect ratio */
      border: 2px solid #ccc;              /* Light border around image */
      border-radius: 8px;                  /* Rounded corners for soft look */
      margin-bottom: 1rem;                 /* Space between image and text */
    }

    /* ==== Project Descriptions ==== */
    .project-section p {
      font-size: 1rem;                     /* Standard readable font size */
      line-height: 1.6;                    /* Line spacing for readability */
      color: #333;                         /* Dark gray text color for readability */
    }
  </style>
</head>

<body class="survey-page">
  <!-- Global Navigation Bar -->
  <nav>
    <img src="/assets/images/common/surveyor.gif" alt="Surveyor Logo">
    <div class="site-title">Virtual Bill Brown</div>
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/gis-portfolio/">GIS Portfolio</a></li>
      <li><a href="/survey-mapping/">Survey/Mapping</a></li>
      <li><a href="/excavation-of/">Excavation Of…</a></li>
      <li><a href="/bioarchaeology/">Bioarchaeology</a></li>
      <li><a href="/education/">Education</a></li>
      <li><a href="/artifact-photography/">Artifact Photography</a></li>
    </ul>
  </nav>

  <!-- Hero Section with title -->
  <section class="hero">
    <div class="hero-content">
      <div class="hero-title-box">
        <h1>ARTIFACT PHOTOGRAPHY</h1>
      </div>
    </div>
  </section>
</body>
</html>
