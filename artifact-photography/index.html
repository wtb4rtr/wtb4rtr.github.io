<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"> <!-- Set character encoding -->
  <title>Artifact Photography – William’s GIS Portfolio</title> <!-- Page title in browser tab -->
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- Responsive scaling -->
  <link rel="stylesheet" href="/assets/css/style.css"> <!-- Link to shared/global stylesheet -->

  <!-- Page-specific styles -->
  <style>
    /* ==== Ensure full-width layout without horizontal scrollbars ==== */
    html, body {
      margin: 0;             /* Remove default margin */
      padding: 0;            /* Remove default padding */
      overflow-x: hidden;    /* Prevent horizontal scrolling */
    }

    /* ==== Hero section with background image and top-aligned title ==== */
    body.artphoto-page .hero {
      background-image: url("/assets/images/artifact-photography/presto.jpg"); /* Background image */
      background-size: cover;           /* Cover entire section */
      background-repeat: no-repeat;     /* Prevent image repetition */
      background-position: center;      /* Center the image */
      background-attachment: fixed;     /* Fixed image on scroll (parallax effect) */
      height: 100vh;                    /* Full viewport height */
      display: flex;                    /* Use Flexbox for layout */
      flex-direction: column;          /* Stack elements vertically */
      justify-content: flex-start;     /* Align content to top of section */
      align-items: center;             /* Center content horizontally */
      text-align: center;              /* Center text alignment */
      padding-top: 2rem;               /* Space above the title box */
    }

    /* ==== Title box styling ==== */
    body.artphoto-page .hero-title-box {
      background: #f8f8ff;             /* Background color: Ghost White */
      padding: 0.75rem 1rem;           /* Padding: top/bottom and left/right */
      border-radius: 12px;             /* Rounded corners */
    }

    /* ==== Page title inside title box ==== */
    body.artphoto-page .hero-title-box h1 {
      margin: 0;                       /* Remove default margin */
      font-size: 3.5rem;               /* Large font size */
      color: #ffffff;                  /* White text */
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6); /* Subtle shadow for contrast */
    }

    
  </style>
</head>

<body class="artphoto-page"> <!-- Page-specific class for scoping styles -->

  <!-- ==== Global Navigation Bar ==== -->
  <nav>
    <img src="/assets/images/common/surveyor.gif" alt="Surveyor Logo">
    <div class="site-title">Virtual Bill Brown</div>
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/gis-portfolio/">GIS Portfolio</a></li>
      <li><a href="/survey-mapping/">Survey/Mapping</a></li>
      <li><a href="/excavation-of/">Excavation Of…</a></li>
      <li><a href="/bioarchaeology/">Bioarchaeology</a></li>
      <li><a href="/education/">Education</a></li>
      <li><a href="/artifact-photography/">Artifact Photography</a></li>
    </ul>
  </nav>

  <!-- ==== Hero Section with Title ==== -->
  <section class="hero">
    <div class="hero-content">
      <div class="hero-title-box">
        <h1>ARTIFACT PHOTOGRAPHY</h1>
      </div>
    </div>
  </section>

</body>
</html>
