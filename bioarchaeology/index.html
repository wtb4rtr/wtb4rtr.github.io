<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Excavation – William’s GIS Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/assets/css/style.css">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">

  <!-- Page-specific styles -->
  <style>
/* Bioarchaeology page title font */
body.bioarch-page h1 {
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
}

/* Hero section background image and layout */
body.bioarch-page .hero {
  background-image: url("/assets/images/bioarchaeology/bones1.jpg"); /* update as needed */
  background-size: cover;
  background-repeat: no-repeat;
  background-position: center top;
  background-attachment: scroll;
  height: 100vh;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  align-items: center;
  padding-top: 1rem;
}

/* Centered title container */
body.bioarch-page .hero-content {
  text-align: center;
  z-index: 2;
  margin-bottom: 1rem;
}

/* Title box with slate + bone colors */
body.bioarch-page .hero-title-box {
  background: #2f4f4f;             /* Dark Slate Gray */
  padding: 0.5rem 1.25rem;
  border-radius: 12px;
  display: inline-block;
  box-shadow: 0 0 25px rgba(0, 0, 0, 0.3);
  border: 3px solid #f8f8dc;       /* Bone White border */
}

/* Title text */
body.bioarch-page .hero-title-box h1 {
  margin: 0;
  font-size: 3.5rem;
  color: #f8f8dc;                  /* Bone White */
  letter-spacing: 2px;
  text-transform: uppercase;
  position: relative;
  text-shadow: 2px 2px #00000040;  /* Optional: subtle shadow */
}

/* Decorative underline */
body.bioarch-page .hero-title-box h1::after {
  content: "";
  display: block;
  margin: 0.5rem auto 0 auto;
  width: 200px;
  height: 3.5px;
  background: #f8f8dc;
  border-radius: 2px;
}

/* Right-hand nav container */
body.bioarch-page .hero-nav-container {
  position: absolute;
  top: 2rem;
  right: 1rem;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Nav box with dark background */
body.bioarch-page .hero-nav {
  background-color: #080808;       /* Vampire Black */
  padding: 0.75rem;
  border-radius: 8px;
  border: 2px solid #f8f8dc;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

/* Nav links styled as bone-colored buttons */
body.bioarch-page .hero-nav a {
  display: block;
  background: #f8f8dc;             /* Bone/Ivory */
  color: #2f4f4f;                  /* Slate text */
  font-weight: 600;
  text-decoration: none;
  padding: 0.5rem 1rem;
  border-radius: 6px;
  transition: all 0.2s ease-in-out;
  border: none;
  outline: none;
  box-shadow: none;
  font-family: 'Oswald', sans-serif;
}

/* Hover effect: shift + color change */
body.bioarch-page .hero-nav a:hover {
  background: #2f4f4f;             /* Slate hover background */
  color: #f8f8dc;                  /* Bone White text */
  transform: translateX(3px);
}
</style>

</head>

<body class="bioarch-page">

    </ul>
  </nav>

  <section class="hero">
    <!-- Title Box -->
    <div class="hero-content">
      <div class="hero-title-box">
        <h1>BIOARCHAEOLOGY</h1>
      </div>
    </div>

    <!-- Right-hand Vertical Nav -->
    <div class="hero-nav-container">
      <nav class="hero-nav">
        <a href="maya/">MAYA</a>
        <a href="southwest/">SOUTHWEST</a>
        <a href="miss/">MISSISSIPPIAN</a>
        <a href="historic/">HISTORIC CEMETERIES</a>
        <a href="europe/">EUROPE</a>
        <a href="faunal/">FAUNAL</a>
      </nav>
    </div>
  </section>

  <!-- Future Content -->
  <main>
    <!-- Page-specific content goes here -->
  </main>
</body>
</html>
