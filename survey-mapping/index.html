<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Survey/Mapping – William’s GIS Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    /* Reset browser default spacing */
    html, body {
      margin: 0;
      padding: 0;
    }

    /* Hero Section */
    body.survey-page .hero {
      background-image: url("/assets/images/survey-mapping/mapcover.jpg");
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      background-attachment: fixed;
      height: 60vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding-top: 2rem;
      text-align: center;
    }

    body.survey-page .hero-title-box {
      background: #738678;
      padding: 0.75rem 1rem;
      border-radius: 12px;
    }

    body.survey-page .hero-title-box h1 {
      margin: 0;
      font-size: 3.5rem;
      color: #ffffff;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6);
    }

    /* FULL WIDTH Map Section with oldmap.jpg */
    .map-section {
      width: 100%;
      margin: 0;
      padding: 4rem 0;
      background: url("/assets/images/survey-mapping/oldmap.jpg") no-repeat center center;
      background-size: 100% 100%;
      background-attachment: scroll;
    }

    .map-container {
      max-width: 960px;
      width: 90%;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.92);
      padding: 1rem 2rem;
      border-radius: 10px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .map-title {
      font-size: 1.75rem;
      color: #2c2c2c;
      margin-bottom: 1rem;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>
</head>

<body class="survey-page">
  <!-- NAV -->
  <nav>
    <img src="/assets/images/common/surveyor.gif" alt="Surveyor Logo">
    <div class="site-title">Virtual Bill Brown</div>
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/gis-portfolio/">GIS Portfolio</a></li>
      <li><a href="/survey-mapping/">Survey/Mapping</a></li>
      <li><a href="/excavation-of/">Excavation Of…</a></li>
      <li><a href="/bioarchaeology/">Bioarchaeology</a></li>
      <li><a href="/education/">Education</a></li>
      <li><a href="/artifact-photography/">Artifact Photography</a></li>
    </ul>
  </nav>

  <!-- TITLE HERO -->
  <section class="hero">
    <div class="hero-content">
      <div class="hero-title-box">
        <h1>SURVEYING AND CARTOGRAPHY</h1>
      </div>
    </div>
  </section>

  <!-- MAP SECTION FULL WIDTH -->
  <section class="map-section">
    <div class="map-container">
      <h2 class="map-title">Where I’ve Mapped</h2>
      <iframe 
        src="https://www.google.com/maps/d/embed?mid=1eCE7iulBFrUk2cZ5bNzIaDaL7n7ctU8&ehbc=2E312F" 
        width="100%" 
        height="480" 
        style="border: 2px solid #333; border-radius: 10px;">
      </iframe>
    </div>
  </section>
</body>
</html>
