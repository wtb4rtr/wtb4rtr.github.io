<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Survey/Mapping – William’s GIS Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/assets/css/style.css"> <!-- Global stylesheet -->

  <!-- Inline styles for full-screen background and design -->
  <style>
    /* Hero section with full-screen background */
    .hero {
      background-image: url("/assets/images/survey-mapping/mapcover.jpg"); /* Use the survey/mapping image */
      background-size: cover;                /* Stretch image to fill the container */
      background-repeat: no-repeat;          /* Prevent tiling */
      background-position: center center;    /* Center the image */
      background-attachment: fixed;          /* Create subtle parallax effect */
      height: 100vh;                         /* Full viewport height */
      display: flex;                         /* Flexbox layout for centering */
      flex-direction: column;                /* Stack title and nav vertically */
      justify-content: center;               /* Vertically center content */
      align-items: center;                   /* Horizontally center content */
      position: relative;                    /* For absolute child positioning if needed */
      text-align: center;                    /* Center text alignment */
    }

    /* Title box for headline and name */
    .hero-title-box {
      background: rgba(0, 0, 0, 0.85);       /* Deep black with transparency */
      padding: 2rem 3rem;                    /* Space around text */
      border-radius: 12px;                   /* Rounded corners */
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);/* Soft shadow for lift */
    }

    /* Page title (section) */
    .hero-title-box h2 {
      margin: 0;
      font-size: 2.25rem;                    /* Bigger font for visibility */
      color: #fff;                           /* Bright white title */
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5); /* Shadow for contrast */
    }

    /* Subtitle with author name */
    .hero-title-box h1 {
      margin: 0.5rem 0 0 0;
      font-size: 1.35rem;
      color: #ccc;                           /* Soft gray name text */
      letter-spacing: 1px;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3); /* Slight contrast */
    }

    /* Lower navigation container */
    .hero-nav-container {
      margin-top: 2rem;                      /* Space above nav links */
    }

    /* Button-style links */
    .hero-nav a {
      margin: 0 1rem;                        /* Space between buttons */
      padding: 0.75rem 1.5rem;               /* Padding inside each button */
      background-color: #ffffff;             /* Bright white background */
      color: #2c2c2c;                        /* Dark gray text */
      text-decoration: none;                 /* Remove underlines */
      font-weight: bold;                     /* Bold text */
      border-radius: 6px;                    /* Rounded corners */
      transition: background 0.3s ease;      /* Smooth hover transition */
    }

    /* Button hover behavior */
    .hero-nav a:hover {
      background-color: #f1f1f1;             /* Slightly dimmed hover effect */
    }
  </style>
</head>

<body>
  <!-- Global Navigation Bar -->
  <nav>
    <img src="/assets/images/common/surveyor.gif" alt="Surveyor Logo">
    <div class="site-title">Virtual Bill Brown</div>
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/gis-portfolio/">GIS Portfolio</a></li>
      <li><a href="/survey-mapping/">Survey/Mapping</a></li>
      <li><a href="/excavation-of/">Excavation Of…</a></li>
      <li><a href="/bioarchaeology/">Bioarchaeology</a></li>
      <li><a href="/education/">Education</a></li>
      <li><a href="/artifact-photography/">Artifact Photography</a></li>
    </ul>
  </nav>

  <!-- Hero Section with Background Image -->
  <section class="hero">
    <div class="hero-content">
      <div class="hero-title-box">
        <h2>SURVEY/MAPPING</h2>
        <h1>WILLIAM T. BROWN</h1>
      </div>
    </div>

    <!-- Lower nav (optional – can add links here later) -->
    <div class="hero-nav-container">
      <nav class="hero-nav">
        <a href="#">EXAMPLE LINK 1</a>
        <a href="#">EXAMPLE LINK 2</a>
      </nav>
    </div>
  </section>

  <!-- Page content -->
  <main>
    <!-- Insert future content here -->
  </main>
</body>
</html>
